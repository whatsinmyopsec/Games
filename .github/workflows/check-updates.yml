name: Check Game Releases & Auto-Update

on:
  schedule:
    # Resets and runs every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  check-and-update:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Live File Analyzer & Recalculate Sizes
        id: check_release
        run: |
          BEFORE_VER=$(grep -o "version: '[^']*'" src/data/torchboundData.ts | head -1 | cut -d"'" -f2)
          python3 scripts/analyze_games.py
          AFTER_VER=$(grep -o "version: '[^']*'" src/data/torchboundData.ts | head -1 | cut -d"'" -f2)
          echo "Previous Version: $BEFORE_VER -> Analyzed Version: $AFTER_VER"

          if ! git diff --quiet src/data/; then
            echo "Data files updated by analyzer!"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "new_version=$AFTER_VER" >> $GITHUB_OUTPUT
          else
            echo "No file size or version changes detected."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit Recalculated Metrics & Tag Release
        if: steps.check_release.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_VER="${{ steps.check_release.outputs.new_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/torchboundData.ts src/data/dungenDoomData.ts
          git commit -m "chore(auto-update): recalculate live game sizes & bump to v$NEW_VER"
          git push origin main

          # Create a GitHub Release if tag does not exist yet
          gh release create "v$NEW_VER" \
            --title "Torchbound v$NEW_VER & Dungen Doom Live Size Recalculation" \
            --notes "Automated file analyzer run: recalculated live zip and bundle sizes for Torchbound (v$NEW_VER) and Dungen Doom. Live at https://whatsinmyopsec.github.io/Games/" || true

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build static site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
